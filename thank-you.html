<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanks</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fb;
        color: #101828;
        padding: 24px;
      }
      .card {
        max-width: 520px;
        background: #fff;
        border: 1px solid rgba(16, 24, 40, 0.1);
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 18px 50px rgba(16, 24, 40, 0.16);
      }
      a {
        display: inline-block;
        margin-top: 16px;
        color: #0d6efd;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Thanks, you're on the list.</h1>
      <p>We've received your submission.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
